[package]
name = "spawned-concurrency"
description = "Spawned Concurrency"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
cluster = ["dep:spawned-cluster", "dep:serde"]
cluster-libp2p = ["cluster", "spawned-cluster/libp2p"]

[dependencies]
spawned-address = { workspace = true }
spawned-wire = { workspace = true }
spawned-cluster = { workspace = true, optional = true }
spawned-rt = { workspace = true }
spawned-macros = { workspace = true }
tracing = { workspace = true }
futures = "0.3.1"
thiserror = "2.0.12"
pin-project-lite = "0.2"
serde = { version = "1", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
spawned-cluster = { workspace = true, features = ["libp2p"] }
tracing-subscriber = { workspace = true }
# This tokio imports are only used in tests, we should not use them in the library code.
tokio-stream = { version = "0.1.17" }
tokio = { version = "1", features = ["full"] }
