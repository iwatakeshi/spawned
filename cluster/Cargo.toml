[package]
name = "spawned-cluster"
description = "Cluster routing and transport abstractions for Spawned"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
spawned-address = { workspace = true }
spawned-wire = { workspace = true }
thiserror = "2.0.12"
tracing = { workspace = true }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.0", features = ["alloc"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
spawned-concurrency = { workspace = true, features = ["cluster"] }
spawned-rt = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
tracing-subscriber = { workspace = true }
